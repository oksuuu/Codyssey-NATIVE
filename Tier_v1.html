<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 티어리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161c; --panel:#1d2029; --line:#2e3340; --text:#eceef3; --muted:#9aa1b2; --accent:#ffb84d;
  --S:#ff6b6b; --A:#ffa94d; --B:#ffd43b; --C:#8ce99a; --D:#74c0fc; --F:#b197fc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:1.15rem}
header button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font:inherit;font-size:.8rem;cursor:pointer}
#board{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.tier{display:flex;min-height:96px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tier.over{outline:2px dashed var(--accent);outline-offset:-2px}
.label{width:56px;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:#14161c}
.items{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-content:flex-start}
.card{width:58px;height:87px;border-radius:4px;background:#2a2e3a center/cover no-repeat;position:relative;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:none}
.card .ph{position:absolute;inset:0;padding:4px;font-size:.62rem;display:flex;align-items:center;text-align:center;color:var(--muted);word-break:keep-all}
.card.dragging{opacity:.35}
#ghost{position:fixed;z-index:99;pointer-events:none;width:70px;height:105px;border-radius:5px;background:#2a2e3a center/cover;box-shadow:0 8px 24px #000a;transform:translate(-50%,-60%) scale(1.05);display:none}
#dock{border-top:2px solid var(--line);background:var(--panel);padding:10px 16px 14px;height:44vh;min-height:230px;display:flex;flex-direction:column;gap:8px}
#dock.over{outline:2px dashed #ff6b6b;outline-offset:-4px}
form{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:6px;font:inherit}
form button,.btn{background:var(--accent);color:#14161c;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
#title{font-size:.85rem;color:var(--muted)}
#title b{color:var(--accent)}
#results{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
#results .card{width:84px;height:126px}
.msg{color:var(--muted);font-size:.9rem;padding:8px 0;line-height:1.6;width:100%}
.msg.err{color:#ff8787}
.msg input{width:100%;margin:6px 0;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:6px;font:inherit}
.cap{position:absolute;left:0;right:0;bottom:0;font-size:.6rem;padding:10px 3px 2px;background:linear-gradient(transparent,#000d);border-radius:0 0 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
  <h1>🎬 영화 티어리스트</h1>
  <button id="cfg" type="button">API 주소 설정</button>
</header>
<main id="board"></main>
<section id="dock">
  <form id="form">
    <input type="search" id="q" placeholder="영화 제목을 입력하세요" autocomplete="off">
    <button type="submit">검색</button>
  </form>
  <div id="title"></div>
  <div id="results"><div class="msg">영화를 검색한 뒤 포스터를 길게 눌러 위의 티어로 끌어다 놓으세요.</div></div>
</section>
<div id="ghost"></div>

<script>
/* ===== 설정 =====
   Cloudflare Worker 주소를 입력하세요(예: https://my-tmdb.example.workers.dev).
   Worker는 TMDB API v3 경로(/search/movie 등)를 그대로 받아 API 키를 붙여 전달해야 합니다.
   비워 두면 화면의 'API 주소 설정' 버튼으로 입력할 수 있습니다(브라우저에 저장됨). */
const WORKER_URL = "";

const TIERS = ["S","A","B","C","D","F"];
const IMG = "https://image.tmdb.org/t/p/w185";
const KEY = "movieTierlist.v1", CFG = "movieTierlist.worker";

const $ = s => document.querySelector(s);
const board = $("#board"), results = $("#results"), dock = $("#dock"), ghost = $("#ghost"), titleEl = $("#title");

let tiers = load();
let panelMovies = new Map();   // 패널에 표시 중인 영화
let recToken = 0;

function load(){
  try{ const t = JSON.parse(localStorage.getItem(KEY)); if(t) return Object.assign(Object.fromEntries(TIERS.map(k=>[k,[]])), t); }catch(e){}
  return Object.fromEntries(TIERS.map(k=>[k,[]]));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(tiers)); }catch(e){} }
function workerUrl(){
  let u = WORKER_URL; try{ u = u || localStorage.getItem(CFG) || ""; }catch(e){}
  return u.replace(/\/+$/,"");
}

/* ===== API ===== */
async function api(path, params={}){
  const base = workerUrl();
  if(!base) throw new Error("NOCFG");
  const qs = new URLSearchParams({language:"ko-KR", ...params});
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 10000);
  try{
    const r = await fetch(`${base}${path}?${qs}`, {signal:ctl.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}
const slim = m => ({id:m.id, title:m.title||m.name||"제목 없음", poster:m.poster_path||null});

/* ===== 렌더링 ===== */
function cardEl(m, source, caption){
  const d = document.createElement("div");
  d.className = "card"; d.dataset.id = m.id; d.dataset.source = source; d.title = m.title;
  if(m.poster) d.style.backgroundImage = `url(${IMG}${m.poster})`;
  else d.innerHTML = `<div class="ph">${esc(m.title)}</div>`;
  if(caption) d.insertAdjacentHTML("beforeend", `<div class="cap">${esc(caption)}</div>`);
  return d;
}
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderBoard(){
  board.innerHTML = "";
  for(const t of TIERS){
    const row = document.createElement("div"); row.className = "tier"; row.dataset.tier = t;
    row.innerHTML = `<div class="label" style="background:var(--${t})">${t}</div><div class="items"></div>`;
    const box = row.querySelector(".items");
    tiers[t].forEach(m => box.appendChild(cardEl(m, "tier")));
    board.appendChild(row);
  }
}
function renderPanel(list, title){
  titleEl.innerHTML = title || "";
  results.innerHTML = "";
  panelMovies = new Map();
  list.forEach(m => { panelMovies.set(String(m.id), m); results.appendChild(cardEl(m, "panel")); });
}
function showMsg(text, err, html){
  titleEl.innerHTML = "";
  results.innerHTML = `<div class="msg ${err?"err":""}">${html||esc(text)}</div>`;
}
function errMsg(e){
  if(e.message === "NOCFG"){
    showMsg("", false, `Cloudflare Worker 주소가 설정되지 않았습니다.<br>주소를 입력하고 저장하세요.<input id="wurl" placeholder="https://example.workers.dev"><button class="btn" id="wsave" type="button">저장</button>`);
    $("#wsave").onclick = () => { try{ localStorage.setItem(CFG, $("#wurl").value.trim()); }catch(e){} showMsg("저장되었습니다. 다시 검색해 보세요."); };
  } else if(e.name === "AbortError") showMsg("응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.", true);
  else showMsg("영화 정보를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.", true);
}

/* ===== 검색 ===== */
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if(!q) return;
  recToken++;                       // 진행 중인 추천 요청 무효화
  showMsg("검색 중…");
  try{
    const data = await api("/search/movie", {query:q, include_adult:"false"});
    const list = (data.results||[]).map(slim);
    if(!list.length) return showMsg(`'${q}'에 대한 검색 결과가 없습니다.`);
    renderPanel(list, `검색 결과: <b>${esc(q)}</b>`);
  }catch(err){ errMsg(err); }
});
$("#cfg").onclick = () => errMsg(new Error("NOCFG"));

/* ===== 추천 ===== */
function onBoardIds(){ return new Set(TIERS.flatMap(t=>tiers[t].map(m=>m.id))); }

async function recommend(movie){
  const token = ++recToken;
  showMsg(`‘${movie.title}’ 기반 추천을 찾는 중…`);
  try{
    const detail = await api(`/movie/${movie.id}`, {append_to_response:"credits"});
    if(token !== recToken) return;
    const director = ((detail.credits||{}).crew||[]).find(c=>c.job==="Director");
    const genres = (detail.genres||[]).slice(0,2).map(g=>g.id);

    const calls = [
      api(`/movie/${movie.id}/recommendations`),
      api(`/movie/${movie.id}/similar`)
    ];
    if(director) calls.push(api("/discover/movie", {with_crew:director.id, sort_by:"vote_count.desc"}));
    if(genres.length) calls.push(api("/discover/movie", {with_genres:genres.join(","), sort_by:"vote_count.desc", "vote_count.gte":"300"}));
    const settled = await Promise.allSettled(calls);
    if(token !== recToken) return;
    if(settled.every(s=>s.status==="rejected")) throw settled[0].reason;

    const owned = onBoardIds(); owned.add(movie.id);
    const seen = new Set(), out = [];
    // 감독 작품 → 추천 → 유사 → 장르 순으로 섞어 다양하게 노출
    const order = [director?2:-1, 0, 1, genres.length ? (director?3:2) : -1].filter(i=>i>=0);
    const lists = order.map(i => settled[i].status==="fulfilled" ? (settled[i].value.results||[]) : []);
    for(let k=0;k<20;k++) for(const l of lists){
      const m = l[k]; if(!m || owned.has(m.id) || seen.has(m.id)) continue;
      seen.add(m.id); out.push(slim(m));
    }
    if(!out.length) return showMsg("추천할 영화를 찾지 못했습니다. 다른 영화를 배치해 보세요.");
    const basis = director ? `${esc(director.name)} 감독` : "";
    const gname = (detail.genres||[]).slice(0,2).map(g=>g.name).join("·");
    renderPanel(out.slice(0,24), `<b>${esc(movie.title)}</b> 기반 추천 (${[basis, gname].filter(Boolean).join(" · ")})`);
  }catch(err){ if(token === recToken) errMsg(err); }
}

/* ===== 드래그 앤 드롭 (마우스·터치 공용, 길게 눌러 드래그) ===== */
let drag = null;

document.addEventListener("pointerdown", e => {
  const card = e.target.closest(".card"); if(!card || e.button > 0) return;
  const id = card.dataset.id, source = card.dataset.source;
  const movie = source === "panel" ? panelMovies.get(id) : findOnBoard(+id);
  if(!movie) return;
  drag = {card, movie, source, x:e.clientX, y:e.clientY, active:false, touch:e.pointerType !== "mouse", timer:null};
  if(drag.touch) drag.timer = setTimeout(() => begin(drag.x, drag.y), 300);
});
document.addEventListener("pointermove", e => {
  if(!drag) return;
  if(!drag.active){
    const moved = Math.hypot(e.clientX-drag.x, e.clientY-drag.y);
    if(drag.touch){ if(moved > 10){ clearTimeout(drag.timer); drag = null; } }
    else if(moved > 5) begin(e.clientX, e.clientY);
    return;
  }
  move(e.clientX, e.clientY);
});
document.addEventListener("pointerup", e => {
  if(!drag) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  if(!d.active){                       // 단순 클릭: 티어 안의 포스터는 제거
    if(d.source === "tier") removeFromBoard(d.movie.id, true);
    return;
  }
  end(d, e.clientX, e.clientY);
});
document.addEventListener("pointercancel", () => { if(drag && !drag.active){ clearTimeout(drag.timer); drag = null; } else if(drag) cleanup(); });
document.addEventListener("touchmove", e => { if(drag && drag.active) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", e => { if(e.target.closest(".card")) e.preventDefault(); });
document.addEventListener("dragstart", e => e.preventDefault());

function begin(x, y){
  drag.active = true;
  drag.card.classList.add("dragging");
  ghost.style.backgroundImage = drag.movie.poster ? `url(${IMG}${drag.movie.poster})` : "none";
  ghost.style.display = "block";
  move(x, y);
}
function move(x, y){
  ghost.style.left = x+"px"; ghost.style.top = y+"px";
  document.querySelectorAll(".tier.over").forEach(t=>t.classList.remove("over"));
  dock.classList.remove("over");
  const t = target(x, y);
  if(t.tier) t.tier.classList.add("over");
  else if(t.dock && drag.source === "tier") dock.classList.add("over");
}
function target(x, y){
  const el = document.elementFromPoint(x, y);
  return {tier: el && el.closest(".tier"), dock: el && el.closest("#dock")};
}
function cleanup(){
  ghost.style.display = "none";
  document.querySelectorAll(".dragging").forEach(c=>c.classList.remove("dragging"));
  document.querySelectorAll(".tier.over").forEach(t=>t.classList.remove("over"));
  dock.classList.remove("over");
  drag = null;
}
function end(d, x, y){
  const t = target(x, y);
  cleanup();
  if(t.tier){
    const key = t.tier.dataset.tier;
    removeFromBoard(d.movie.id, false);
    tiers[key].push({id:d.movie.id, title:d.movie.title, poster:d.movie.poster});
    save(); renderBoard();
    recommend(d.movie);
  } else if(t.dock && d.source === "tier"){
    removeFromBoard(d.movie.id, true);
  }
}
function findOnBoard(id){ for(const t of TIERS){ const m = tiers[t].find(m=>m.id===id); if(m) return m; } return null; }
function removeFromBoard(id, rerender){
  for(const t of TIERS) tiers[t] = tiers[t].filter(m=>m.id!==id);
  if(rerender){ save(); renderBoard(); }
}

renderBoard();
</script>
</body>
</html>
